name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: takumi-runner
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Takumi Guard for npm
        uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1.2.0
        with:
          bot-id: BT01M0MFTWGD1BQ2CKEPG92G53Y3

      - name: Install Node.js and pnpm pinned in mise.toml
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and test
        run: pnpm run check

  idpctl:
    runs-on: takumi-runner
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Anonymous mode: a pull request validation job gets no OIDC permission
      # (.github/workflows/AGENT.md), and a bot-id would require id-token: write.
      - name: Enable Takumi Guard for Go modules
        uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0

      - name: Install Go and oapi-codegen pinned in mise.toml
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: go go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen

      - name: gofmt, go vet, build, test, and the generated-code drift check
        run: mise run idpctl:check

  infra:
    runs-on: takumi-runner
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Takumi Guard step: it covers no Terraform provider registry, and
      # nothing here fetches npm, PyPI, RubyGems, Go, or Packagist packages.
      - name: Install Terraform and ShellCheck pinned in mise.toml
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: terraform shellcheck

      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -recursive -diff

      # -backend=false skips the R2 state backend, so no Cloudflare or R2
      # credential is needed; the provider comes from .terraform.lock.hcl.
      - name: terraform init
        run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform -chdir=infra validate

      # The tests use a mock provider and run offline (infra/tests).
      - name: terraform test
        run: terraform -chdir=infra test

      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/test/*.sh scripts/test/stubs/*

      # Offline: only published test vectors, no op, cf, network, or key generation.
      - name: scripts/lib.sh tests
        run: scripts/test/lib.test.sh

      # Offline: a stub op and an openssl wrapper that refuses genpkey (scripts/test/stubs).
      - name: scripts/generate-admin-key.sh tests
        run: scripts/test/generate-admin-key.test.sh

  e2e:
    runs-on: takumi-runner
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Takumi Guard for npm
        uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1.2.0
        with:
          bot-id: BT01M0MFTWGD1BQ2CKEPG92G53Y3

      - name: Install Node.js and pnpm pinned in mise.toml
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser build matching the locked @playwright/test, from Playwright's download host (not npm), and the
      # system libraries it needs.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # The IdP Worker on workerd with its assets and a local D1, over TLS with a certificate generated in the run.
      - name: Browser end-to-end tests
        run: pnpm run e2e
